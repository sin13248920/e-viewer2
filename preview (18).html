<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월간00 e뷰어</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
}

/* 🔥 자유 레이아웃 */
#app {
  width: 100%;
  min-height: 100vh;
  margin: auto;
  background: #fff;
  display: flex;
  flex-direction: column;
}

/* 헤더 */
.header {
  padding: 10px 20px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header img {
  height: 50px;
  cursor: pointer;
}

.header-text {
  font-size: 14px;
  color: black;
}

/* 콘텐츠 */
.content {
  flex: 1;
  padding-bottom: 40px;
}

/* 홈 */
.grid {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
  min-height: 60vh;
  margin: 0 auto;
  padding-top: 40px;
}

/* 카드 */
.card {
  width: 200px;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.card:active {
  transform: scale(0.95);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card p {
  text-align: center;
}

/* 배지 */
.badge, .badge-coming {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 8px;
  color: white;
}

.badge { background: red; }
.badge-coming { background: gray; }

/* 화면 */
.screen {
  display: none;
  min-height: 60vh;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.screen.active {
  display: flex;
  opacity: 1;
}

/* 뷰어 */
#viewer {
  justify-content: center;
  align-items: center;
}

.viewer-container {
  width: 90%;
  height: 70vh;
  display: flex;
  flex-direction: column;
}

.toolbar {
  padding: 10px;
  background: #f0f0f0;
}

/* 버튼 애니메이션 */
button {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  background: #e5e5e5;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  background: #dcdcdc;
}

button:active {
  transform: scale(0.92);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

iframe {
  flex: 1;
  width: 100%;
  border: none;
}

/* Coming */
#coming {
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-size: 24px;
}

/* 푸터 */
.footer {
  padding: 10px;
  background: #fafafa;
  border-top: 1px solid #ddd;
  font-size: 12px;
  text-align: center;
  line-height: 1.3;
}

.footer p {
  margin: 2px 0;
}

.footer img {
  height: 30px;
  margin-bottom: 5px;
}

/* 모바일 */
@media (max-width: 768px) {

  body {
    overflow-y: auto;
  }

  #app {
    min-height: 100vh;
  }

  .grid {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding-top: 30px;
  }

  .card {
    width: 70%;
  }

  .header img {
    height: 40px;
  }

  .header-text {
    font-size: 12px;
  }

  .viewer-container {
    height: 60vh;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <img src="https://drive.google.com/thumbnail?id=1lFUKv4ZpRblOeLCLD8aUp11aR952kQdj&sz=w1000" onclick="goHome()">
    <div class="header-text">스토리가 있는 서오월간지</div>
  </div>

  <div class="content">

    <div id="home" class="screen active">
      <div class="grid">

        <div class="card" onclick="openPDF()">
          <div class="badge">최신호</div>
          <img src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">
          <p>2026년 5월호</p>
        </div>

        <div class="card" onclick="showComing()">
          <div class="badge-coming">출간예정</div>
          <img src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">
          <p>2026년 6월호</p>
        </div>

      </div>
    </div>

    <div id="viewer" class="screen">
      <div class="viewer-container">
        <div class="toolbar">
          <button onclick="goHome()">⬅ 목록으로</button>
        </div>
        <iframe id="pdfFrame"></iframe>
      </div>
    </div>

    <div id="coming" class="screen">
      <button onclick="goHome()">⬅ 목록으로</button>
      <div style="margin-top:20px;">📢 Coming Soon</div>
    </div>

  </div>

  <div class="footer">
    <img src="https://drive.google.com/thumbnail?id=1Sr1eMqd6h21-HVOj93iMOohGJ1rAx3or&sz=w500">

    <p>[02565] 서울시 동대문구 천호대로 145(용두동)</p>
    <p>&nbsp;</p>

    <p>
      대표번호 : 02-2127-4114, 4300 (120 다산콜센터로 연결) |
      02-2127-5000 (당직실 연결) |
      02-2127-4000 (야간, 공휴일/당직실)
    </p>

    <p>
      FAX : 02-2127-5096 (종합상황실)
    </p>
  </div>

</div>

<script>
const fileId = "1S94VEwUqHhRLyCjxZpLcRbsL83ktm3xw";

function openPDF() {
  switchScreen("viewer");
  document.getElementById("pdfFrame").src =
    `https://drive.google.com/file/d/${fileId}/preview`;
}

function showComing() {
  switchScreen("coming");
}

function goHome() {
  switchScreen("home");
  document.getElementById("pdfFrame").src = "";
}

function switchScreen(id) {
  document.querySelectorAll(".screen").forEach(el => {
    el.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
