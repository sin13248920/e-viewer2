<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 6월호</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  font-weight: bold;
  color: #666;
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div id="header"></div>

  <!-- CONTENT -->
  <div class="center">
    Coming Soon
  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

</div>

<script>
fetch("components/header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
