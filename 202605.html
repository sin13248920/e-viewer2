<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 5월호</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

.viewer {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

iframe {
  width: 90%;
  height: 80vh;
  border: none;
}
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div id="header"></div>

  <!-- VIEWER -->
  <div class="viewer">
    <iframe src="https://drive.google.com/file/d/1S94VEwUqHhRLyCjxZpLcRbsL83ktm3xw/preview"></iframe>
  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

</div>

<script>
fetch("components/header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
