<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 5월호</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f4f4f4;
}

/* 콘텐츠 */
.viewer-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  min-height: calc(100vh - 120px);
}

/* 카드 */
.viewer-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  max-width: 1100px;
  width: 100%;
  overflow: auto;
}

/* 페이지 */
.page-container {
  display: flex;
  justify-content: center;
  gap: 10px;
}

/* 캔버스 */
canvas {
  width: 100%;
  max-width: 48%;
  border-radius: 8px;
  background: #fff;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* 애니메이션 */
.page-enter {
  transform: translateX(40px);
  opacity: 0;
}

.page-active {
  transform: translateX(0);
  opacity: 1;
}

/* 컨트롤 */
.controls {
  text-align: center;
  margin-top: 12px;
}

.controls button {
  margin: 5px;
  padding: 8px 14px;
  border: none;
  background: #eee;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}

.controls button:hover {
  background: #ddd;
}

/* 모바일 */
@media (max-width: 768px) {
  .page-container {
    flex-direction: column;
  }

  canvas {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<!-- 🔥 헤더 -->
<div id="header"></div>

<!-- 본문 -->
<div class="viewer-wrapper">
  <div class="viewer-card">

    <div class="page-container">
      <canvas id="leftCanvas"></canvas>
      <canvas id="rightCanvas"></canvas>
    </div>

    <div class="controls">
      <button onclick="prevPage()">◀ 이전</button>
      <span id="pageInfo"></span>
      <button onclick="nextPage()">다음 ▶</button>
      <br>
      <button onclick="zoomOut()">➖ 축소</button>
      <button onclick="zoomIn()">➕ 확대</button>
    </div>

  </div>
</div>

<!-- 🔥 푸터 -->
<div id="footer"></div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* 🔥 컴포넌트 로드 */
fetch("components/header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("components/footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

/* 🔥 PDF 설정 */
const url = "https://raw.githubusercontent.com/sin13248920/weekly-seo-viewer/main/test01.pdf";

let pdfDoc = null;
let currentPage = 1;
let scale = 1.5;

/* 로드 */
pdfjsLib.getDocument(url).promise.then(pdf => {
  pdfDoc = pdf;
  renderPages();
});

/* 렌더 분기 */
function renderPages() {
  if (window.innerWidth < 768) {
    renderSingle(currentPage);
  } else {
    if (currentPage === 1) {
      renderSingle(1);
    } else {
      renderDouble(currentPage, currentPage + 1);
    }
  }
}

/* 단일 */
function renderSingle(num) {
  const left = document.getElementById("leftCanvas");
  const right = document.getElementById("rightCanvas");

  right.style.display = "none";
  renderPageToCanvas(num, left);

  document.getElementById("pageInfo").textContent =
    `${num} / ${pdfDoc.numPages}`;
}

/* 두 페이지 */
function renderDouble(leftNum, rightNum) {
  const left = document.getElementById("leftCanvas");
  const right = document.getElementById("rightCanvas");

  right.style.display = "block";

  renderPageToCanvas(leftNum, left);

  if (rightNum <= pdfDoc.numPages) {
    renderPageToCanvas(rightNum, right);
  } else {
    right.style.display = "none";
  }

  document.getElementById("pageInfo").textContent =
    `${leftNum}-${Math.min(rightNum, pdfDoc.numPages)} / ${pdfDoc.numPages}`;
}

/* 공통 렌더 */
function renderPageToCanvas(num, canvas) {
  pdfDoc.getPage(num).then(page => {
    const ctx = canvas.getContext("2d");
    const viewport = page.getViewport({ scale: scale });

    canvas.height = viewport.height;
    canvas.width = viewport.width;

    page.render({
      canvasContext: ctx,
      viewport: viewport
    });

    animateCanvas(canvas);
  });
}

/* 애니메이션 */
function animateCanvas(canvas) {
  canvas.classList.add("page-enter");

  setTimeout(() => {
    canvas.classList.remove("page-enter");
    canvas.classList.add("page-active");
  }, 10);

  setTimeout(() => {
    canvas.classList.remove("page-active");
  }, 300);
}

/* 페이지 이동 */
function nextPage() {
  if (window.innerWidth < 768) {
    currentPage++;
  } else {
    if (currentPage === 1) currentPage = 2;
    else currentPage += 2;
  }

  if (currentPage > pdfDoc.numPages) return;
  renderPages();
}

function prevPage() {
  if (window.innerWidth < 768) {
    currentPage--;
  } else {
    if (currentPage === 2) currentPage = 1;
    else currentPage -= 2;
  }

  if (currentPage < 1) currentPage = 1;
  renderPages();
}

/* 확대 */
function zoomIn() {
  scale += 0.3;
  renderPages();
}

function zoomOut() {
  scale = Math.max(0.8, scale - 0.3);
  renderPages();
}

/* 리사이즈 대응 */
window.addEventListener("resize", renderPages);
</script>

</body>
</html>
