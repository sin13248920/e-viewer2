<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월간서오 e뷰어</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #f5f5f5;
  font-family: 'Segoe UI', sans-serif;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

/* CONTENT */
.content {
  flex: 1;
}

.grid {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
  min-height: 60vh;
  padding: 40px 0 80px 0;
}

.card {
  width: 200px;
  cursor: pointer;
  transition: 0.2s;
  position: relative;
}

.card:hover {
  transform: scale(1.08);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card p {
  text-align: center;
}

.badge, .badge-coming {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 4px 8px;
  font-size: 12px;
  color: white;
  border-radius: 8px;
}

.badge { background: red; }
.badge-coming { background: gray; }

/* HEADER + FOOTER 영역 삽입 위치 */
</style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div id="header"></div>

  <!-- CONTENT -->
  <div class="content">

    <div class="grid">

      <div class="card" onclick="location.href='202605.html'">
        <div class="badge">최신호</div>
        <img src="https://drive.google.com/thumbnail?id=1hk7NpBIfWI06E5XDO2oZi5J0ZSnydCk5&sz=w1000">
        <p>2026년 5월호</p>
      </div>

      <div class="card" onclick="location.href='202606.html'">
        <div class="badge-coming">출간예정</div>
        <img src="https://drive.google.com/thumbnail?id=1OSbIGt3ZwVDYecxrVhHrB_v8R-oVirsd&sz=w1000">
        <p>2026년 6월호</p>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

</div>

<script>
fetch("components/header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("components/footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
